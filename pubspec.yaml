name: fastingapp
description: "Intermittent fasting app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Routing
  go_router: ^16.1.0

  # Network
  dio: ^5.7.0

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Serialization / immutability
  json_annotation: ^4.10.0
  freezed_annotation: ^2.4.4

  # Localization
  easy_localization: ^3.0.7

  # Assets / codegen output usage
  flutter_svg: ^2.0.16

  # Uzak görseller (CDN + cihaz önbelleği)
  crypto: ^3.0.6
  path_provider: ^2.1.5

  # Ağ durumu (internet yok sayfası)
  connectivity_plus: ^7.0.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # In-app purchase (RevenueCat)
  purchases_flutter: ^8.4.1
  purchases_ui_flutter: ^8.4.1
  image_picker: ^1.2.3
  camera: ^0.12.1
  share_plus: ^12.0.2
  home_widget: ^0.10.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  flutter_timezone: ^5.1.1
  package_info_plus: ^9.0.1
  uuid: ^4.6.0
  firebase_messaging: ^16.7.0
  health: ^13.3.1
  in_app_review: ^2.0.12
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.14
  json_serializable: ^6.9.0
  injectable_generator: ^2.6.2
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.14.4
  very_good_analysis: ^7.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    # assets/images PNG'leri uygulamaya gömülmez: asset_sources/images → CDN
    # (tool/remote_images.dart). Burada yalnızca gömülü olanlar var.
    - assets/images/bundled/
    - assets/images/mochi/
    - assets/remote_images/
    - assets/icons/
    - assets/flags/
    - assets/gifs/
    - assets/colors/
    - assets/translations/

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/sf-pro-display/SFPRODISPLAYREGULAR.OTF
        - asset: assets/fonts/sf-pro-display/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        # Upright "semibold" yok; Bold upright w600 olarak maplenir.
        - asset: assets/fonts/sf-pro-display/SFPRODISPLAYBOLD.OTF
          weight: 600
        - asset: assets/fonts/sf-pro-display/SFPRODISPLAYSEMIBOLDITALIC.OTF
          weight: 600
          style: italic
        - asset: assets/fonts/sf-pro-display/SFPRODISPLAYBOLD.OTF
          weight: 700
        - asset: assets/fonts/sf-pro-display/SFPRODISPLAYHEAVYITALIC.OTF
          weight: 800
          style: italic
        - asset: assets/fonts/sf-pro-display/SFPRODISPLAYBLACKITALIC.OTF
          weight: 900
          style: italic
        - asset: assets/fonts/sf-pro-display/SFPRODISPLAYLIGHTITALIC.OTF
          weight: 300
          style: italic
        - asset: assets/fonts/sf-pro-display/SFPRODISPLAYTHINITALIC.OTF
          weight: 100
          style: italic
        - asset: assets/fonts/sf-pro-display/SFPRODISPLAYULTRALIGHTITALIC.OTF
          weight: 200
          style: italic
    - family: ShareTech
      fonts:
        - asset: assets/fonts/share-tech/ShareTech-Regular.ttf
          weight: 400
    - family: Baloo
      fonts:
        - asset: assets/fonts/baloo/Baloo-Regular.ttf
          weight: 400
    - family: AnnapurnaSIL
      fonts:
        - asset: assets/fonts/annapurna/AnnapurnaSIL-Regular.ttf
          weight: 400

# flutter_gen configuration — build_runner ile üretilir.
flutter_gen:
  output: lib/generated/
  line_length: 80
  integrations:
    flutter_svg: true
  colors:
    inputs:
      - assets/colors/colors.xml

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asset_sources/images/App Icon.png"
  adaptive_icon_background: "#A8D5BA"
  adaptive_icon_foreground: "asset_sources/images/App Icon.png"
  remove_alpha_ios: true
